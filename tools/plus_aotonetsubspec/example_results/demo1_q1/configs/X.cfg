hostname X
!
ip prefix-list TARGET seq 5 permit 5.5.5.5/32
!
route-map NO_TRANSIT deny 10
 match ip address prefix-list TARGET
!
route-map NO_TRANSIT permit 20
!
interface GigabitEthernet0/0
 description to-A
 ip address 10.1.1.1 255.255.255.252
!
interface GigabitEthernet0/1
 description to-B
 ip address 10.1.3.1 255.255.255.252
!
interface GigabitEthernet0/2
 description to-T
 ip address 10.1.5.1 255.255.255.252
!
route-map FROM_T permit 10
 set as-path prepend 65103
!
router bgp 65100
 bgp router-id 192.0.2.6
 neighbor 10.1.1.2 remote-as 65101
 neighbor 10.1.1.2 send-community
 neighbor 10.1.1.2 route-map NO_TRANSIT out
 neighbor 10.1.3.2 remote-as 65102
 neighbor 10.1.3.2 send-community
 neighbor 10.1.3.2 route-map NO_TRANSIT out
 neighbor 10.1.5.2 remote-as 65103
 neighbor 10.1.5.2 route-map FROM_T in
 neighbor 10.1.5.2 send-community
 neighbor 10.1.5.2 route-map NO_TRANSIT out
!
