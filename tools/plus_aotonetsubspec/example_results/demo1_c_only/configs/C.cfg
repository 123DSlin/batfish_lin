hostname C
!
ip prefix-list TARGET seq 5 permit 5.5.5.5/32
!
route-map ORIGINATE permit 10
 match ip address prefix-list TARGET
!
interface Loopback0
 ip address 5.5.5.5 255.255.255.255
!
interface GigabitEthernet0/0
 description to-A
 ip address 10.1.2.2 255.255.255.252
!
interface GigabitEthernet0/1
 description to-B
 ip address 10.1.4.2 255.255.255.252
!
interface GigabitEthernet0/2
 description to-T
 ip address 10.1.6.2 255.255.255.252
!
route-map BLOCK_REIMPORT deny 10
 match ip address prefix-list TARGET
!
route-map BLOCK_REIMPORT permit 20
!
router bgp 65104
 bgp router-id 192.0.2.5
 neighbor 10.1.2.1 remote-as 65101
 neighbor 10.1.2.1 route-map BLOCK_REIMPORT in
 neighbor 10.1.2.1 send-community
 neighbor 10.1.4.1 remote-as 65102
 neighbor 10.1.4.1 route-map BLOCK_REIMPORT in
 neighbor 10.1.4.1 send-community
 neighbor 10.1.6.1 remote-as 65103
 neighbor 10.1.6.1 route-map BLOCK_REIMPORT in
 neighbor 10.1.6.1 send-community
 redistribute connected route-map ORIGINATE
!
