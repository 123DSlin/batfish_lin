hostname T
!
ip community-list standard QUARANTINE permit 65050:99
ip community-list standard LOWTRUST permit 65050:10
!
route-map FROM_ISP deny 10
 match community QUARANTINE
!
route-map FROM_ISP permit 20
 match community LOWTRUST
 set as-path prepend 65105
!
route-map FROM_ISP permit 30
!
interface GigabitEthernet0/0
 description to-X
 ip address 10.1.5.2 255.255.255.252
!
interface GigabitEthernet0/1
 description to-C
 ip address 10.1.6.1 255.255.255.252
!
interface GigabitEthernet0/2
 description to-I
 ip address 10.1.7.1 255.255.255.252
!
route-map FROM_CUSTOMER permit 10
 set metric 10
!
router bgp 65103
 bgp router-id 192.0.2.4
 neighbor 10.1.5.1 remote-as 65100
 neighbor 10.1.5.1 send-community
 neighbor 10.1.6.2 remote-as 65104
 neighbor 10.1.6.2 route-map FROM_CUSTOMER in
 neighbor 10.1.6.2 send-community
 neighbor 10.1.7.2 remote-as 65105
 neighbor 10.1.7.2 send-community
 neighbor 10.1.7.2 route-map FROM_ISP in
!
