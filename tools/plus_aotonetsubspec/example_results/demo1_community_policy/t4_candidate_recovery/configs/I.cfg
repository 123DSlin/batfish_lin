hostname I
!
ip prefix-list TARGET seq 5 permit 5.5.5.5/32
!
route-map ORIGINATE permit 10
 match ip address prefix-list TARGET
 set community 65050:99
!
interface Loopback0
 ip address 5.5.5.5 255.255.255.255
!
interface GigabitEthernet0/0
 description to-T
 ip address 10.1.7.2 255.255.255.252
!
route-map BLOCK_REIMPORT deny 10
 match ip address prefix-list TARGET
!
route-map BLOCK_REIMPORT permit 20
!
router bgp 65105
 bgp router-id 192.0.2.1
 neighbor 10.1.7.1 remote-as 65103
 neighbor 10.1.7.1 route-map BLOCK_REIMPORT in
 neighbor 10.1.7.1 send-community
 redistribute connected route-map ORIGINATE
!
