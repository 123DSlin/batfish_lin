hostname R1
!
interface Loopback0
 ip address 10.0.0.1 255.255.255.0
!
interface Ethernet12
 ip address 192.0.12.1 255.255.255.252
!
interface Ethernet13
 shutdown
 ip address 192.0.13.1 255.255.255.252
!
interface Ethernet14
 ip address 192.0.14.1 255.255.255.252
!
ip prefix-list pl seq 5 permit 10.0.0.0/24
!
route-map REDISTRIBUTE_CONNECTED permit 10
 match ip address prefix-list pl
!
route-map EXPORT_ALL permit 10
!
router bgp 100
 bgp router-id 1.1.1.1
 redistribute connected route-map REDISTRIBUTE_CONNECTED
 neighbor 192.0.12.2 remote-as 200
 neighbor 192.0.12.2 route-map EXPORT_ALL out
 neighbor 192.0.13.2 remote-as 300
 neighbor 192.0.13.2 route-map EXPORT_ALL out
 neighbor 192.0.14.2 remote-as 400
 neighbor 192.0.14.2 route-map EXPORT_ALL out
