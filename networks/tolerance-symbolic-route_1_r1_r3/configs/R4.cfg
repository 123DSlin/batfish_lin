hostname R4
!
ip prefix-list pl seq 5 permit 10.0.0.0/24
!
route-map R4_IN_FROM_R2 permit 10
 match ip address prefix-list pl
 set local-preference 200
!
route-map R4_IN_FROM_R1 permit 10
 match ip address prefix-list pl
 set local-preference 100
!
route-map R4_IN_FROM_R3 permit 10
 match ip address prefix-list pl
 set local-preference 50
!
interface Ethernet41
 ip address 192.0.14.2 255.255.255.252
!
interface Ethernet42
 ip address 192.0.24.2 255.255.255.252
!
interface Ethernet43
 ip address 192.0.34.2 255.255.255.252
!
router bgp 400
 bgp router-id 4.4.4.4
 neighbor 192.0.14.1 remote-as 100
 neighbor 192.0.14.1 route-map R4_IN_FROM_R1 in
 neighbor 192.0.24.1 remote-as 200
 neighbor 192.0.24.1 route-map R4_IN_FROM_R2 in
 neighbor 192.0.34.1 remote-as 300
 neighbor 192.0.34.1 route-map R4_IN_FROM_R3 in
