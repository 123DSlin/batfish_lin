hostname R2
!
interface Ethernet21
 shutdown
 ip address 192.0.12.2 255.255.255.252
!
interface Ethernet24
 ip address 192.0.24.1 255.255.255.252
!
route-map IMPORT_ALL permit 10
!
route-map EXPORT_ALL permit 10
!
router bgp 200
 bgp router-id 2.2.2.2
 neighbor 192.0.12.1 remote-as 100
 neighbor 192.0.12.1 route-map IMPORT_ALL in
 neighbor 192.0.24.2 remote-as 400
 neighbor 192.0.24.2 route-map EXPORT_ALL out
