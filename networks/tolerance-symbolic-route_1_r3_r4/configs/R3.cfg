hostname R3
!
interface Ethernet31
 ip address 192.0.13.2 255.255.255.252
!
interface Ethernet34
 shutdown
 ip address 192.0.34.1 255.255.255.252
!
route-map IMPORT_ALL permit 10
!
route-map EXPORT_ALL permit 10
!
router bgp 300
 bgp router-id 3.3.3.3
 neighbor 192.0.13.1 remote-as 100
 neighbor 192.0.13.1 route-map IMPORT_ALL in
 neighbor 192.0.34.2 remote-as 400
 neighbor 192.0.34.2 route-map EXPORT_ALL out
