!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname r5
!
boot-start-marker
boot-end-marker
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
multilink bundle-name authenticated
!
ip tcp synwait-time 5
!
interface Loopback0
 ip address 192.18.5.101 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
! r5 -- r2
interface GigabitEthernet0/0
 ip address 192.18.2.2 255.255.255.252
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
! r5 -- r3
interface GigabitEthernet1/0
 ip address 192.18.4.6 255.255.255.252
 negotiation auto
!
! r5 -- r4
interface GigabitEthernet2/0
 ip address 192.18.5.2 255.255.255.252
!
router bgp 500
 bgp router-id 192.18.5.101
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 neighbor as200 peer-group
 neighbor as200 remote-as 200
 neighbor as300 peer-group
 neighbor as300 remote-as 300
 neighbor as400 peer-group
 neighbor as400 remote-as 400
 neighbor 192.18.2.1 peer-group as200
 neighbor 192.18.4.5 peer-group as300
 neighbor 192.18.5.1 peer-group as400
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  neighbor as200 send-community both
  neighbor as200 route-map R5_IN_FROM_R2 in
  neighbor as300 send-community both
  neighbor as300 route-map R5_IN_FROM_R3 in
  neighbor as400 send-community both
  neighbor as400 route-map R5_IN_FROM_R4 in
  neighbor 192.18.2.1 activate
  neighbor 192.18.4.5 activate
  neighbor 192.18.5.1 activate
  maximum-paths ibgp 4
  maximum-paths eibgp 4
 exit-address-family
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ip prefix-list P1 seq 5 permit 198.51.100.0/24
ip prefix-list P2 seq 5 permit 198.51.101.0/24
ip prefix-list BLOCK_24S seq 5 permit 198.51.100.0/23 ge 24 le 24
!
! p1 primary from r2, p2 backup from r2.
route-map R5_IN_FROM_R2 permit 10
 match ip address prefix-list P1
 set local-preference 300
!
route-map R5_IN_FROM_R2 permit 20
 match ip address prefix-list P2
 set local-preference 100
!
route-map R5_IN_FROM_R2 deny 100
!
! r3 is the shared hidden backup exit.
route-map R5_IN_FROM_R3 permit 10
 match ip address prefix-list P1
 set local-preference 200
!
! r3 is the shared hidden backup exit.
route-map R5_IN_FROM_R3 permit 10
 match ip address prefix-list P2
 set local-preference 200
!
route-map R5_IN_FROM_R3 deny 100
!
! p2 primary from r4, p1 backup from r4.
route-map R5_IN_FROM_R4 permit 10
 match ip address prefix-list P2
 set local-preference 300
!
route-map R5_IN_FROM_R4 permit 20
 match ip address prefix-list P1
 set local-preference 100
!
route-map R5_IN_FROM_R4 deny 100
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
