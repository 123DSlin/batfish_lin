!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname r1
!
boot-start-marker
boot-end-marker
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
multilink bundle-name authenticated
!
ip tcp synwait-time 5
!
interface Loopback0
 ip address 192.18.1.101 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
! r1 -- r2
interface GigabitEthernet0/0
 ip address 192.18.1.1 255.255.255.252
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 no ip address
 shutdown
 negotiation auto
!
! r1 -- r4
interface GigabitEthernet2/0
 ip address 192.18.4.1 255.255.255.252
!
router bgp 100
 bgp router-id 192.18.1.101
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 neighbor as200 peer-group
 neighbor as200 remote-as 200
 neighbor as400 peer-group
 neighbor as400 remote-as 400
 neighbor 192.18.1.2 peer-group as200
 neighbor 192.18.4.2 peer-group as400
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  network 198.51.100.0 mask 255.255.255.0
  network 198.51.101.0 mask 255.255.255.0
  neighbor as200 send-community both
  neighbor as200 route-map R1_OUT_TO_R2 out
  neighbor as400 send-community both
  neighbor as400 route-map R1_OUT_TO_R4 out
  neighbor 192.18.1.2 activate
  neighbor 192.18.4.2 activate
  maximum-paths ibgp 4
  maximum-paths eibgp 4
 exit-address-family
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ip prefix-list P1 seq 5 permit 198.51.100.0/24
ip prefix-list P2 seq 5 permit 198.51.101.0/24
ip prefix-list BLOCK_24S seq 5 permit 198.51.100.0/23 ge 24 le 24
!
route-map R1_OUT_TO_R2 permit 10
 match ip address prefix-list BLOCK_24S
!
route-map R1_OUT_TO_R2 deny 100
!
route-map R1_OUT_TO_R4 permit 10
 match ip address prefix-list BLOCK_24S
!
route-map R1_OUT_TO_R4 deny 100
!
ip route 198.51.100.0 255.255.255.0 Null0
ip route 198.51.101.0 255.255.255.0 Null0
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
