!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname r3
!
boot-start-marker
boot-end-marker
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
multilink bundle-name authenticated
!
ip tcp synwait-time 5
!
interface Loopback0
 ip address 192.18.3.101 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
! r3 -- r2
interface GigabitEthernet0/0
 ip address 192.18.3.2 255.255.255.252
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
! r3 -- r5
interface GigabitEthernet1/0
 ip address 192.18.4.5 255.255.255.252
 negotiation auto
!
! r3 -- r4
interface GigabitEthernet2/0
 ip address 192.18.6.1 255.255.255.252
 negotiation auto
!
router bgp 300
 bgp router-id 192.18.3.101
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 neighbor as200 peer-group
 neighbor as200 remote-as 200
 neighbor as400 peer-group
 neighbor as400 remote-as 400
 neighbor as500 peer-group
 neighbor as500 remote-as 500
 neighbor 192.18.3.1 peer-group as200
 neighbor 192.18.6.2 peer-group as400
 neighbor 192.18.4.6 peer-group as500
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  neighbor as200 send-community both
  neighbor as200 route-map R3_DENY_CRITICAL out
  neighbor as400 send-community both
  neighbor as400 route-map R3_DENY_CRITICAL out
  neighbor as500 send-community both
  neighbor as500 route-map R3_OUT_TO_R5 out
  neighbor 192.18.3.1 activate
  neighbor 192.18.6.2 activate
  neighbor 192.18.4.6 activate
  maximum-paths ibgp 4
  maximum-paths eibgp 4
 exit-address-family
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ip prefix-list BLOCK_24S seq 5 permit 198.51.100.0/23 ge 24 le 24
!
! Shared hidden backup exit to r5.
route-map R3_OUT_TO_R5 permit 10
 match ip address prefix-list BLOCK_24S
!
route-map R3_OUT_TO_R5 deny 100
!
! Keep r3 as a one-way backup transit toward r5 for the critical prefixes.
route-map R3_DENY_CRITICAL deny 10
 match ip address prefix-list BLOCK_24S
!
route-map R3_DENY_CRITICAL permit 100
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
