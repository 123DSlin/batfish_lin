!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname r4
!
boot-start-marker
boot-end-marker
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
multilink bundle-name authenticated
!
ip tcp synwait-time 5
!
interface Loopback0
 ip address 192.18.4.101 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
! r4 -- r1
interface GigabitEthernet0/0
 ip address 192.18.4.2 255.255.255.252
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
! r4 -- r5
interface GigabitEthernet1/0
 ip address 192.18.5.1 255.255.255.252
 negotiation auto
!
! r4 -- r3
interface GigabitEthernet2/0
 ip address 192.18.6.2 255.255.255.252
 negotiation auto
!
router bgp 400
 bgp router-id 192.18.4.101
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 neighbor as100 peer-group
 neighbor as100 remote-as 100
 neighbor as300 peer-group
 neighbor as300 remote-as 300
 neighbor as500 peer-group
 neighbor as500 remote-as 500
 neighbor 192.18.4.1 peer-group as100
 neighbor 192.18.6.1 peer-group as300
 neighbor 192.18.5.2 peer-group as500
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  neighbor as100 send-community both
  neighbor as300 send-community both
  neighbor as300 route-map R4_OUT_TO_R3 out
  neighbor as500 send-community both
  neighbor as500 route-map R4_OUT_TO_R5 out
  neighbor 192.18.4.1 activate
  neighbor 192.18.6.1 activate
  neighbor 192.18.5.2 activate
  maximum-paths ibgp 4
  maximum-paths eibgp 4
 exit-address-family
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ip prefix-list P2 seq 5 permit 198.51.101.0/24
ip prefix-list BLOCK_24S seq 5 permit 198.51.100.0/23 ge 24 le 24
!
!
! Hidden backup through r3 is used only for p2 when r4-r5 fails.
route-map R4_OUT_TO_R3 permit 10
 match ip address prefix-list P2
!
route-map R4_OUT_TO_R3 deny 100
!
!
route-map R4_OUT_TO_R5 permit 10
 match ip address prefix-list BLOCK_24S
!
route-map R4_OUT_TO_R5 deny 100
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
