!
! traffic_split_demo / r3
! Transit for SL_F1_P2 / SL_F2_Q2 (node 3.3.3.3, SID 16003)
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname r3
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 ip router isis 1
 isis prefix-sid absolute 16003
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description to-r1
 ip address 10.0.13.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 description to-r2
 ip address 10.0.23.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 negotiation auto
!
interface GigabitEthernet2/0
 description to-r4
 ip address 10.0.34.1 255.255.255.252
 ip router isis 1
 isis network point-to-point
 negotiation auto
!
!
!
router isis 1
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
 segment-routing mpls
!
!
! No head-end SR-TE policy on r3 (transit only).
!
ip forward-protocol nd
!
!
!
no ip http server
no ip http secure-server
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
