!
! traffic_split_demo / r2
! f2 (r2 -> r4): q1=r2-r1-r4, q2=r2-r3-r4; equal split 50/50
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname r2
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 ip router isis 1
 isis prefix-sid absolute 16002
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description to-r1
 ip address 10.0.12.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 description to-r3
 ip address 10.0.23.1 255.255.255.252
 ip router isis 1
 isis network point-to-point
 negotiation auto
!
!
!
router isis 1
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
 segment-routing mpls
!
!
! --- SR-TE (extension target) ---
segment-routing
 traffic-eng
  segment-list name SL_F2_Q1
   index 10 address ipv4 1.1.1.1
   index 20 address ipv4 4.4.4.4
  !
  segment-list name SL_F2_Q2
   index 10 address ipv4 3.3.3.3
   index 20 address ipv4 4.4.4.4
  !
  policy POL_F2_TO_R4
   color 200 end-point ipv4 4.4.4.4
   candidate-paths
    preference 100
     explicit segment-list SL_F2_Q1
      weight 50
     !
     explicit segment-list SL_F2_Q2
      weight 50
     !
    !
   !
  !
 !
!
! Steering f2 -> POL_F2_TO_R4 (SR extension syntax)
ip route 4.4.4.4 255.255.255.255 segment-routing policy POL_F2_TO_R4
!
!
ip forward-protocol nd
!
!
!
no ip http server
no ip http secure-server
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
