!
! traffic_demo / r4
! Destination endpoint 4.4.4.4 / SID 16004 for f1 and f2
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname r4
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.255
 ip router isis 1
 isis prefix-sid absolute 16004
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description to-r1
 ip address 10.0.14.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 description to-r3
 ip address 10.0.34.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 negotiation auto
!
!
!
router isis 1
 net 49.0001.0000.0000.0004.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
 segment-routing mpls
!
!
ip forward-protocol nd
!
!
!
no ip http server
no ip http secure-server
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
