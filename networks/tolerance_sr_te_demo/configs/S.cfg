hostname S
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 ip router isis 1
 isis prefix-sid absolute 16003
!
interface GigabitEthernet0/0
 description upper-to-A
 ip address 10.0.23.1 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
 isis adjacency-sid absolute 24001
!
interface GigabitEthernet0/1
 description lower-to-B
 ip address 10.0.34.1 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
 isis adjacency-sid absolute 24003
!
router isis 1
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
 segment-routing mpls
!
segment-routing mpls
 local-block 24000 24999
!
segment-routing traffic-eng
 segment-list upper-via-A
  index 10 mpls label 24001
  index 20 mpls label 24002
 segment-list lower-via-B
  index 10 mpls label 24003
  index 20 mpls label 24004
 policy split-to-D
  color 100 end-point ipv4 5.5.5.5
  candidate-paths
   preference 100
    explicit segment-list upper-via-A weight 50
   preference 100
    explicit segment-list lower-via-B weight 50
!
