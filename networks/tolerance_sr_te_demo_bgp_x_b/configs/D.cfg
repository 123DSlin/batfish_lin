hostname D
!
ip prefix-list D_LOOPBACK seq 5 permit 5.5.5.5/32
!
route-map BGP_ORIGINATE permit 10
 match ip address prefix-list D_LOOPBACK
!
interface Loopback0
 ip address 5.5.5.5 255.255.255.255
 ip router isis 1
 isis prefix-sid absolute 16005
!
interface GigabitEthernet0/0
 description to-X
 ip address 10.0.15.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
!
interface GigabitEthernet0/1
 description to-A
 ip address 10.0.25.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
!
interface GigabitEthernet0/2
 description to-B
 ip address 10.0.45.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
!
router isis 1
 net 49.0001.0000.0000.0005.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
 segment-routing mpls
!
router bgp 16005
 bgp router-id 5.5.5.5
 redistribute connected route-map BGP_ORIGINATE
 neighbor 10.0.15.1 remote-as 16001
 neighbor 10.0.25.1 remote-as 16002
 neighbor 10.0.45.1 remote-as 16004
!
segment-routing mpls
 local-block 24000 24999
!
