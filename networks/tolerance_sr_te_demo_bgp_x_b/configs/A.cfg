hostname A
!
interface GigabitEthernet0/0
 description to-X
 ip address 10.0.12.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
!
interface GigabitEthernet0/1
 description to-D
 ip address 10.0.25.1 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
 isis adjacency-sid absolute 24002
!
interface GigabitEthernet0/2
 description to-S
 ip address 10.0.23.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
!
router isis 1
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 segment-routing mpls
!
router bgp 16002
 bgp router-id 2.2.2.2
 neighbor 10.0.12.1 remote-as 16001
 neighbor 10.0.25.2 remote-as 16005
!
segment-routing mpls
 local-block 24000 24999
!
