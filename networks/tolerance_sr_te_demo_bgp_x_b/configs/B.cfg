hostname B
!
interface GigabitEthernet0/0
 description to-S
 ip address 10.0.34.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
!
interface GigabitEthernet0/1
 description to-D
 ip address 10.0.45.1 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
 isis adjacency-sid absolute 24004
!
interface GigabitEthernet0/2
 description to-X
 ip address 10.0.14.2 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
!
router isis 1
 net 49.0001.0000.0000.0004.00
 is-type level-2-only
 metric-style wide
 segment-routing mpls
!
router bgp 16004
 bgp router-id 4.4.4.4
 neighbor 10.0.14.1 remote-as 16001
 neighbor 10.0.45.2 remote-as 16005
!
segment-routing mpls
 local-block 24000 24999
!
