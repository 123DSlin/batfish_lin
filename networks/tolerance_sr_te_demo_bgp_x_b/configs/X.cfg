hostname X
!
ip prefix-list D_LOOPBACK seq 5 permit 5.5.5.5/32
!
route-map X_IN_FROM_D permit 10
 match ip address prefix-list D_LOOPBACK
 set local-preference 200
!
route-map X_IN_FROM_A permit 10
 match ip address prefix-list D_LOOPBACK
 set local-preference 100
!
route-map X_IN_FROM_B permit 10
 match ip address prefix-list D_LOOPBACK
 set local-preference 50
!
interface GigabitEthernet0/0
 description primary-to-D
 ip address 10.0.15.1 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
!
interface GigabitEthernet0/1
 description backup-to-A
 ip address 10.0.12.1 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
!
interface GigabitEthernet0/2
 description backup-to-B
 ip address 10.0.14.1 255.255.255.252
 ip router isis 1
 isis network point-to-point
 isis metric 10
!
router isis 1
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 segment-routing mpls
!
router bgp 16001
 bgp router-id 1.1.1.1
 neighbor 10.0.15.2 remote-as 16005
 neighbor 10.0.15.2 route-map X_IN_FROM_D in
 neighbor 10.0.12.2 remote-as 16002
 neighbor 10.0.12.2 route-map X_IN_FROM_A in
 neighbor 10.0.14.2 remote-as 16004
 neighbor 10.0.14.2 route-map X_IN_FROM_B in
!
segment-routing mpls
 local-block 24000 24999
!
